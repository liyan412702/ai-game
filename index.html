<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AI游戏造梦器 v4.6</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family: system-ui, sans-serif; user-select:none; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  #canvas2d { position:relative; z-index:2; }
  #game-bg { position:fixed; inset:0; background-size:cover; background-position:center; z-index:1; opacity:0.5; display:none; }
  #version-badge { position:fixed; top:calc(12px + env(safe-area-inset-top)); right:70px; color:#00ffcc; background:rgba(0,255,204,0.15); border:1px solid #00ffcc; padding:2px 8px; border-radius:4px; font-size:12px; font-weight:bold; z-index:10; }
  #hud { position:fixed; top:calc(40px + env(safe-area-inset-top)); left:14px; color:#fff; font-size:14px; text-shadow:0 1px 3px #000; pointer-events:none; line-height:1.5; z-index:5; }
  #hud .big { font-size:26px; font-weight:800; color:#4ea1ff; }
  #ai-thoughts { position:fixed; top:calc(120px + env(safe-area-inset-top)); left:14px; right:14px; color:#00ffcc; font-size:12px; font-style:italic; background:rgba(0,0,0,0.8); padding:8px; border-radius:6px; border-left:3px solid #00ffcc; display:none; line-height:1.4; z-index:5; }
  
  #loading-mask { position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:50; display:none; flex-direction:column; align-items:center; justify-content:center; color:#fff; backdrop-filter:blur(5px); }
  #loading-mask.show { display:flex; }
  .spinner { width:50px; height:50px; border:4px solid rgba(255,255,255,0.1); border-top-color:#00ffcc; border-radius:50%; animation:spin 1s linear infinite; margin-bottom:20px; }
  @keyframes spin { 100% { transform:rotate(360deg); } }
  
  #controls { position:fixed; left:0; right:0; bottom:calc(10px + env(safe-area-inset-bottom)); display:flex; justify-content:space-between; padding:0 16px; z-index:6; pointer-events:none; }
  .pad { display:flex; gap:12px; pointer-events:auto; }
  .btn-ctrl { width:64px; height:64px; border-radius:50%; border:1.5px solid rgba(255,255,255,.35); background:rgba(255,255,255,.1); color:#fff; font-size:24px; font-weight:700; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(6px); cursor:pointer; }
  .btn-ctrl:active { background:rgba(78,161,255,.6); }
  #jump { width:76px; height:76px; font-size:18px; }
  #shoot { width:76px; height:76px; font-size:18px; background:rgba(255,0,102,0.2); border-color:#ff0066; }
  
  #panel { position:fixed; left:0; right:0; bottom:0; background:rgba(12,12,22,.95); border-top:1px solid rgba(255,255,255,.15); border-radius:18px 18px 0 0; padding:12px 14px calc(14px + env(safe-area-inset-bottom)); z-index:8; transition:transform .3s ease; }
  #panel.collapsed { transform:translateY(calc(100% - 46px)); }
  #panelToggle { height:34px; display:flex; align-items:center; justify-content:center; color:#889; font-size:13px; cursor:pointer; margin-bottom:8px; }
  #prompt { width:100%; height:48px; border-radius:12px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.05); color:#fff; padding:10px; }
  .row { display:flex; gap:8px; margin-top:10px; }
  #gen { flex:1; height:46px; border:none; border-radius:12px; background:linear-gradient(135deg,#4ea1ff,#8b5cf6); color:#fff; font-size:16px; font-weight:700; cursor:pointer; }
  
  #overlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.7); z-index:20; padding:20px; backdrop-filter:blur(4px); }
  #overlay.show { display:flex; }
  #overlay .card { background:rgba(20,20,35,.95); border:1px solid rgba(78,161,255,.3); border-radius:18px; padding:26px; text-align:center; color:#fff; width:100%; max-width:340px; position:relative; overflow:hidden; }
  #art-bg { position:absolute; inset:0; background-size:cover; background-position:center; opacity:0.5; z-index:0; }
  #overlay .card > *:not(#art-bg) { position:relative; z-index:1; }
  #overlay button { width:100%; height:46px; border:none; border-radius:12px; background:linear-gradient(135deg,#4ea1ff,#8b5cf6); color:#fff; font-size:16px; font-weight:700; cursor:pointer; margin-top:20px; }
</style>
</head>
<body>
<div id="loading-mask"><div class="spinner"></div><div id="loading-text" style="color:#00ffcc; font-weight:bold;">主策构思中...</div></div>
<div id="game-bg"></div>
<canvas id="canvas2d"></canvas>
<div id="version-badge">v4.6 修复射速版</div>
<div id="hud">
  <div id="hud-title" style="font-size:16px; margin-bottom:4px; font-weight:700;">AI造梦器</div>
  <div id="hud-main" style="margin-top:4px;">得分 <span class="big" id="score">0</span></div>
  <div id="status" style="margin-top:2px; color:#aab;">生成后开始</div>
</div>
<div id="ai-thoughts"></div>
<div id="controls">
  <div class="pad" id="move-controls"><div class="btn-ctrl" id="left">←</div><div class="btn-ctrl" id="right">→</div></div>
  <div class="pad" id="action-controls"><div class="btn-ctrl" id="jump">跳</div><div class="btn-ctrl" id="shoot">射击</div></div>
</div>
<div id="panel">
  <div id="panelToggle"></div>
  <textarea id="prompt" placeholder="输入你想玩的（如：赛博朋克魂斗罗）"></textarea>
  <div class="row"><button id="gen">✨ 生成游戏</button></div>
</div>
<div id="overlay">
  <div class="card">
    <div id="art-bg"></div>
    <h2 id="ovTitle">游戏结束</h2>
    <p id="ovDesc"></p>
    <button id="ovBtn">再来一次</button>
  </div>
</div>

<script type="module">
const ZHIPU_KEY = '0872c4e54b384de19de2081c4d87e7f0.wqkFwvMWAQfbrLpz';

const SVG_PLAYER = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 60"><rect x="15" y="5" width="20" height="20" fill="%2300ffff" rx="5"/><rect x="10" y="30" width="30" height="25" fill="%234ea1ff" rx="3"/><rect x="0" y="30" width="10" height="8" fill="%23fff"/></svg>';
const imgPlayer = new Image(); imgPlayer.src = SVG_PLAYER;
let playerImgObj = new Image(); 
let enemyImgObj = new Image(); 

let config = { gameType:'shooter', title:'游戏', enemyCount:15, enemyHp:30, enemySpeed:150, playerHp:100, design_thoughts:'', image_url:null, player_url:null, enemy_url:null };
let state = 'ready';
const canvas2d = document.getElementById('canvas2d'), ctx = canvas2d.getContext('2d');
const overlay = document.getElementById('overlay'), ovTitle = document.getElementById('ovTitle'), ovDesc = document.getElementById('ovDesc');
const statusEl = document.getElementById('status'), hudMain = document.getElementById('hud-main'), aiThoughtsEl = document.getElementById('ai-thoughts'), artBg = document.getElementById('art-bg'), gameBg = document.getElementById('game-bg');
const panel = document.getElementById('panel'), promptEl = document.getElementById('prompt');

function resize2D() { canvas2d.width = innerWidth; canvas2d.height = innerHeight; }
window.addEventListener('resize', resize2D);

function showOverlay(title, desc) { 
    ovTitle.textContent = title; ovDesc.textContent = desc; 
    if (config.image_url) artBg.style.backgroundImage = `url(${config.image_url})`;
    else artBg.style.backgroundImage = 'none';
    overlay.classList.add('show'); 
}
document.getElementById('ovBtn').addEventListener('click', () => { overlay.classList.remove('show'); startGame(); });
document.getElementById('panelToggle').addEventListener('click', () => {
    panel.classList.toggle('collapsed');
    if (!panel.classList.contains('collapsed') && state === 'playing') { state = 'paused'; statusEl.textContent = '已暂停'; }
    else if (panel.classList.contains('collapsed') && state === 'paused') { state = 'playing'; statusEl.textContent = '进行中'; }
});

let keys = {left:false, right:false};
let player = { x: 100, y: 0, vx: 0, vy: 0, w: 80, h: 100, hp: 100, onGround: false, dir: 1, invincible: 0, shootCd: 0, isShooting: false };
let camX = 0, shootEnemies = [], shootBullets = [], particles = [], platforms = [], bossSpawned = false, killedCount = 0, spawnTimerShoot = 0;
let initShootY = 0;

function buildShooterScene() {
  resize2D(); initShootY = canvas2d.height - 120;
  player = { x: 100, y: initShootY - 80, vx: 0, vy: 0, w: 80, h: 100, hp: config.playerHp || 100, onGround: false, dir: 1, invincible: 0, shootCd: 0, isShooting: false };
  camX = 0; shootEnemies = []; shootBullets = []; particles = [];
  spawnTimerShoot = 0; killedCount = 0; bossSpawned = false;
  platforms = [{ x: 0, y: initShootY, w: 1000, h: 200 },{ x: 1100, y: initShootY, w: 400, h: 200 },{ x: 1600, y: initShootY - 100, w: 300, h: 200 }];
  
  if (config.image_url) gameBg.style.backgroundImage = `url(${config.image_url})`;
  if (config.player_url) playerImgObj.src = config.player_url;
  if (config.enemy_url) enemyImgObj.src = config.enemy_url;
}

function spawnParticles(x, y, color, count) { for (let i = 0; i < count; i++) particles.push({ x, y, vx: (Math.random() - 0.5) * 400, vy: (Math.random() - 0.5) * 400, life: 1, color }); }

function updateShooter(dt) {
  ctx.clearRect(0, 0, canvas2d.width, canvas2d.height);

  const moveSpeed = 350;
  if (keys.left) { player.vx = -moveSpeed; player.dir = -1; } else if (keys.right) { player.vx = moveSpeed; player.dir = 1; } else { player.vx = 0; }
  player.vy += 1800 * dt; player.x += player.vx * dt; player.y += player.vy * dt;
  if (player.x < 0) player.x = 0; if (player.x > 3000) player.x = 3000;
  player.onGround = false;
  for (let p of platforms) { if (player.x + player.w/2 > p.x && player.x - player.w/2 < p.x + p.w && player.y + player.h > p.y && player.y + player.h < p.y + p.h / 2 && player.vy > 0) { player.y = p.y - player.h; player.vy = 0; player.onGround = true; } }
  let targetCamX = player.x - canvas2d.width / 3; if (targetCamX < 0) targetCamX = 0; camX += (targetCamX - camX) * 10 * dt;
  if (player.invincible > 0) player.invincible -= dt;

  ctx.save(); ctx.translate(-camX, 0);
  
  for (let p of platforms) {
      ctx.fillStyle = '#0a1a15'; 
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#00ffcc'; 
      ctx.fillRect(p.x, p.y, p.w, 6);
  }
  
  // 🌟 修复：主角坐标错误
  if (player.invincible <= 0 || Math.floor(Date.now() / 100) % 2 === 0) {
    ctx.save(); 
    ctx.globalCompositeOperation = 'screen'; 
    if (player.dir === -1) { 
        ctx.translate(player.x, player.y + player.h/2); ctx.scale(-1, 1); 
        if(playerImgObj.complete && playerImgObj.naturalWidth > 0) ctx.drawImage(playerImgObj, -player.w/2, -player.h/2, player.w, player.h); 
        else ctx.drawImage(imgPlayer, -20, -30, 40, 60);
    } else { 
        if(playerImgObj.complete && playerImgObj.naturalWidth > 0) ctx.drawImage(playerImgObj, player.x - player.w/2, player.y, player.w, player.h); 
        else ctx.drawImage(imgPlayer, player.x - 20, player.y, 40, 60); 
    } 
    ctx.restore();
  }

  if (player.isShooting && player.shootCd <= 0) {
    const gunX = player.x + player.dir * 30, gunY = player.y + 40;
    // 🌟 修复：强制限制怪物最高血量为100，子弹伤害保底 20，射速 0.08 秒一发（爽快割草！）
    let safeHp = Math.min(config.enemyHp || 30, 100);
    let dmg = Math.max(20, Math.ceil(safeHp / 2)); 
    shootBullets.push({ x: gunX, y: gunY, vx: player.dir * 1000, vy: 0, dmg });
    player.shootCd = 0.08;
  }
  if (player.shootCd > 0) player.shootCd -= dt;

  for (let i = shootBullets.length - 1; i >= 0; i--) {
    let b = shootBullets[i]; b.x += b.vx * dt; b.y += b.vy * dt;
    ctx.fillStyle = '#ffff00'; ctx.fillRect(b.x, b.y, 12, 4);
    if (b.x > camX + canvas2d.width || b.x < camX - 100) shootBullets.splice(i, 1);
  }

  spawnTimerShoot -= dt;
  const targetEnemies = config.enemyCount || 15;
  if (spawnTimerShoot <= 0 && !bossSpawned) {
    let spawnX = camX + canvas2d.width + 100;
    if (spawnX < 2800) shootEnemies.push({ x: spawnX, y: initShootY - 60, w: 70, h: 70, hp: config.enemyHp || 30, maxHp: config.enemyHp || 30, speed: config.enemySpeed || 150, type: 'ground', dir: -1 });
    spawnTimerShoot = Math.max(0.4, 2.0 - targetEnemies * 0.03);
  }

  for (let i = shootEnemies.length - 1; i >= 0; i--) {
    let en = shootEnemies[i]; en.x += en.speed * dt * en.dir;
    
    if(enemyImgObj.complete && enemyImgObj.naturalWidth > 0){
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        ctx.drawImage(enemyImgObj, en.x - 15, en.y - 20, en.w, en.h);
        ctx.restore();
    } else {
        ctx.fillStyle = '#ff0066'; ctx.fillRect(en.x, en.y, en.w, en.h); 
    }
    ctx.fillStyle = '#ff0000'; ctx.fillRect(en.x, en.y - 10, en.w * (en.hp / en.maxHp), 4);

    // 碰撞体积修正，现在子弹更容易打中
    if (Math.abs(en.x - player.x) < 40 && Math.abs(en.y - player.y) < 60 && player.invincible <= 0) {
      player.hp -= 20; player.invincible = 1.5; spawnParticles(player.x, player.y, '#ff0000', 20);
      if (player.hp <= 0) { state = 'over'; showOverlay('💀 阵亡了！', `击杀数: ${killedCount}`); return; }
    }
    for (let j = shootBullets.length - 1; j >= 0; j--) {
      let b = shootBullets[j];
      // 扩大命中范围
      if (b.x > en.x - 30 && b.x < en.x + en.w + 30 && b.y > en.y - 30 && b.y < en.y + en.h + 30) {
        en.hp -= b.dmg; shootBullets.splice(j, 1); spawnParticles(b.x, b.y, '#ff0066', 5);
        if (en.hp <= 0) { shootEnemies.splice(i, 1); killedCount++; spawnParticles(en.x, en.y, '#ff0066', 15); break; }
      }
    }
    if (en.x < camX - 100) shootEnemies.splice(i, 1);
  }

  if (killedCount >= targetEnemies && !bossSpawned) {
    bossSpawned = true;
    shootEnemies.push({ x: camX + canvas2d.width - 150, y: initShootY - 150, w: 150, h: 150, hp: 300, maxHp: 300, speed: 60, type: 'boss', dir: -1 });
  }
  if (bossSpawned && shootEnemies.length === 0) { state = 'win'; showOverlay('🎉 通关！', `你完成了《${config.title}》`); return; }

  ctx.restore();
  hudMain.innerHTML = `<span style="font-size:26px; font-weight:800; color:#4ea1ff;">${player.hp} HP</span> | 击杀 ${killedCount}/${targetEnemies}`;
}

let lastTime = performance.now();
function animate(now) {
  requestAnimationFrame(animate); const dt = Math.min((now-lastTime)/1000, 0.05); lastTime = now;
  if (state === 'playing') updateShooter(dt);
}

function startGame() {
  overlay.classList.remove('show'); panel.classList.add('collapsed'); state='playing';
  statusEl.textContent = '进行中 · ' + config.title; document.getElementById('hud-title').textContent = config.title;
  if(config.design_thoughts){ 
      aiThoughtsEl.textContent = "💡 主策推演: " + config.design_thoughts; 
      aiThoughtsEl.style.display = 'block'; 
      setTimeout(()=>aiThoughtsEl.style.display='none', 8000); 
  }
  
  gameBg.style.display = config.image_url ? 'block' : 'none';
  resize2D(); buildShooterScene(); 
}

function bindCtrl(id, sFn, eFn) { const el = document.getElementById(id); el.addEventListener('touchstart',(e)=>{e.preventDefault();sFn();}); el.addEventListener('mousedown',sFn); el.addEventListener('touchend',eFn); el.addEventListener('mouseup',eFn); }
bindCtrl('left', ()=>keys.left=true, ()=>keys.left=false); bindCtrl('right', ()=>keys.right=true, ()=>keys.right=false);
bindCtrl('jump', ()=>{ if(state==='playing' && player.onGround){ player.vy=-700; player.onGround=false; } }, ()=>{});
bindCtrl('shoot', ()=>{ if(state==='playing') player.isShooting=true; }, ()=>{ player.isShooting=false; });

document.addEventListener('keydown', (e)=>{ if(e.key==='ArrowLeft'||e.key==='a')keys.left=true; if(e.key==='ArrowRight'||e.key==='d')keys.right=true; if(e.code==='Space'&&state==='playing'&&player.onGround){e.preventDefault();player.vy=-700;player.onGround=false;} if(e.key==='j'||e.key==='J'){if(state==='playing') player.isShooting=true;} });
document.addEventListener('keyup', (e)=>{ if(e.key==='ArrowLeft'||e.key==='a')keys.left=false; if(e.key==='ArrowRight'||e.key==='d')keys.right=false; if(e.key==='j'||e.key==='J') player.isShooting=false; });

async function generateAndProcessImage(prompt) {
    const res = await fetch('https://open.bigmodel.cn/api/paas/v4/images/generations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${ZHIPU_KEY}` },
      body: JSON.stringify({ model: 'cogview-3-flash', prompt: prompt, size: '1024x1024' })
    });
    const data = await res.json();
    if(!data.data || !data.data[0]) return null;
    return data.data[0].url;
}

async function generate() {
  const text = promptEl.value.trim() || '赛博朋克魂斗罗';
  document.getElementById('gen').disabled = true; 
  const mask = document.getElementById('loading-mask'), maskText = document.getElementById('loading-text');
  mask.classList.add('show'); maskText.textContent = '主策正在构思机制...';
  
  try {
    const res = await fetch('/api/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt: text }) });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    config = data;
    
    maskText.textContent = 'AI 正在绘制 场景壁纸...';
    config.image_url = await generateAndProcessImage(`epic wide background, ${config.image_prompt}`);

    maskText.textContent = 'AI 正在拆解 角色立绘...';
    config.player_url = await generateAndProcessImage(`game character sprite, full body, isolated on solid black background, glowing neon, ${config.image_prompt.split(',')[0]}`);

    maskText.textContent = 'AI 正在生成 怪物资产...';
    config.enemy_url = await generateAndProcessImage(`game enemy monster sprite, isolated on solid black background, glowing neon alien`);

  } catch(e) { 
      alert('生成失败: ' + e.message); 
  } finally {
      mask.classList.remove('show');
      document.getElementById('gen').disabled = false;
  }
  
  if(config && config.title) startGame(); 
}
document.getElementById('gen').addEventListener('click', generate);
resize2D(); requestAnimationFrame(animate);
</script>
</body>
</html>
