<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AI造梦器 v8.0</title>
<script src="https://cdn.bootcdn.net/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 大厅 -->
<div id="menu-screen" class="screen active">
  <div class="header">
    <h1>AI 游戏造梦器</h1>
    <p>选择类型，定制你的专属游戏</p>
  </div>
  <div class="category-grid">
    <div class="category-card" onclick="openForm('shooter', '动作射击')">
      <span class="icon">🚀</span><div class="title">动作射击</div>
    </div>
    <div class="category-card" onclick="openForm('tower', '策略塔防')">
      <span class="icon">🛡️</span><div class="title">策略塔防</div>
    </div>
    <div class="category-card" onclick="openForm('parkour', '极速跑酷')">
      <span class="icon">🏃</span><div class="title">极速跑酷</div>
    </div>
    <div class="category-card" onclick="openForm('dressup', '二次元换装')">
      <span class="icon">👗</span><div class="title">二次元换装</div>
    </div>
  </div>
  <button class="btn-main" onclick="showHistory()" style="background:#333;">📜 查看历史记录</button>
</div>

<!-- 配置表单 -->
<div id="form-screen" class="screen">
  <button class="back-btn" onclick="backToMenu()">← 返回大厅</button>
  <h2 id="form-title" class="page-title">定制游戏</h2>
  <div class="form-group">
    <label>游戏主题 / 风格</label>
    <input type="text" id="form-theme" class="form-control" value="赛博朋克霓虹都市">
  </div>
  <div class="row-2">
    <div class="form-group">
      <label>怪物数量</label>
      <input type="number" id="form-enemyCount" class="form-control" value="10">
    </div>
    <div class="form-group">
      <label>怪物血量</label>
      <input type="number" id="form-enemyHp" class="form-control" value="30">
    </div>
  </div>
  <div class="form-group">
    <label>剧情与玩法描述</label>
    <textarea id="form-story" class="form-control" placeholder="例如：主角需要消灭所有怪物，怪物会飞..."></textarea>
  </div>
  <button class="btn-main" onclick="generateGame()">✨ 生成游戏</button>
</div>

<!-- 生成结果预览页 -->
<div id="preview-screen" class="screen">
  <h2 class="page-title" style="text-align:center;">🎉 游戏已生成！</h2>
  <div id="preview-thoughts" style="color:#00ffcc; font-size:13px; margin-bottom:20px; padding:10px; background:rgba(0,0,0,0.5); border-radius:8px;"></div>
  <div style="width:100%; height:200px; background:#000; border-radius:12px; border:2px solid #4ea1ff; display:flex; align-items:center; justify-content:center; overflow:hidden; margin-bottom:20px;">
    <img id="preview-img" style="max-width:100%; max-height:100%; object-fit:contain;" src="">
  </div>
  <button class="btn-main" onclick="startPlay()" style="background:#00ffcc; color:#000;">▶ 开始游戏</button>
  <button class="btn-main" onclick="backToMenu()" style="background:#333; margin-top:10px;">返回大厅</button>
</div>

<!-- 历史记录页 -->
<div id="history-screen" class="screen">
  <button class="back-btn" onclick="backToMenu()">← 返回大厅</button>
  <h2 class="page-title">历史生成记录</h2>
  <div id="history-list"></div>
</div>

<!-- 游戏画面 -->
<div id="game-bg"></div>
<canvas id="canvas2d"></canvas>
<div id="hud">
    <div id="hud-title" style="font-weight:700; margin-bottom:4px;">AI造梦器</div>
    <div style="color:#00ffcc;">敌人剩余: 0</div>
</div>

<button onclick="backToMenu()" style="position:fixed; top:calc(12px + env(safe-area-inset-top)); right:14px; z-index:10; background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.3); color:#fff; padding:6px 12px; border-radius:20px; font-size:12px; display:none;" id="exit-btn">退出</button>

<div id="controls">
  <div class="pad">
    <div class="btn-ctrl" id="btn-left">←</div>
    <div class="btn-ctrl" id="btn-right">→</div>
  </div>
  <div class="pad">
    <div class="btn-ctrl" id="btn-shoot">射击</div>
    <div class="btn-ctrl" id="btn-jump">跳跃</div>
  </div>
</div>

<div id="loading-mask">
  <div class="spinner"></div>
  <div id="loading-text" style="color:#00ffcc; font-weight:bold;">主策推演中...</div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
