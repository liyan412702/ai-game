<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AI造梦器 v8.2</title>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#050508; font-family: system-ui, sans-serif; user-select:none; color:#fff; }
  #game-bg { position:fixed; inset:0; background-size:cover; background-position:center; z-index:1; opacity:0.6; display:none; }
  #canvas2d { position:relative; z-index:2; display:none; width:100%; height:100%; touch-action:none; }
  .screen { position:fixed; inset:0; z-index:10; overflow-y:auto; display:none; padding:24px; }
  .screen.active { display:block; }
  #menu-screen { background:radial-gradient(circle at top, #1a1a3a 0%, #050508 100%); }
  .header h1 { font-size:28px; font-weight:900; background:linear-gradient(135deg,#00ffff,#8b5cf6); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:8px; }
  .header p { color:#889; font-size:14px; margin-bottom:30px; }
  .category-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px; }
  .category-card { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:20px 16px; text-align:center; cursor:pointer; transition:0.2s; }
  .category-card:active { transform:scale(0.95); }
  .category-card .icon { font-size:32px; margin-bottom:12px; display:block; }
  .category-card .title { font-size:16px; font-weight:700; }
  #form-screen, #preview-screen, #history-screen { background:#0a0a14; }
  .page-title { font-size:24px; font-weight:800; margin-bottom:20px; color:#00ffcc; }
  .back-btn { background:none; border:none; color:#889; font-size:14px; margin-bottom:20px; cursor:pointer; padding:10px 0; display:flex; align-items:center; }
  .form-group { margin-bottom:20px; }
  .form-group label { display:block; font-size:14px; color:#aab; margin-bottom:8px; font-weight:600; }
  .form-control { width:100%; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.15); border-radius:12px; padding:12px; color:#fff; font-size:15px; outline:none; }
  textarea.form-control { height:100px; resize:none; }
  .row-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .btn-main { width:100%; height:54px; border-radius:16px; background:linear-gradient(135deg,#00ffff,#8b5cf6); border:none; font-size:18px; font-weight:800; color:#000; cursor:pointer; margin-top:10px; }
  .history-item { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); padding:16px; border-radius:12px; margin-bottom:12px; cursor:pointer; }
  #hud { position:fixed; top:calc(12px + env(safe-area-inset-top)); left:14px; font-size:16px; text-shadow:0 1px 3px #000; z-index:5; display:none; }
  #controls { position:fixed; left:0; right:0; bottom:calc(10px + env(safe-area-inset-bottom)); display:flex; justify-content:space-between; padding:0 16px; z-index:6; display:none; }
  .pad { display:flex; gap:12px; pointer-events:auto; align-items:center;}
  .btn-ctrl { border-radius:50%; border:1.5px solid rgba(255,255,255,.35); background:rgba(255,255,255,.1); color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(6px); cursor:pointer; }
  .btn-ctrl:active { background:rgba(78,161,255,.6); }
  #btn-left, #btn-right { width:80px; height:80px; font-size:30px; }
  #btn-jump { width:90px; height:90px; font-size:18px; background:rgba(0,255,204,0.2); border-color:#00ffcc; }
  #btn-shoot { width:80px; height:80px; font-size:18px; background:rgba(255,0,102,0.2); border-color:#ff0066; }
  #loading-mask { position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:50; display:none; flex-direction:column; align-items:center; justify-content:center; backdrop-filter:blur(5px); }
  #loading-mask.show { display:flex; }
  .spinner { width:50px; height:50px; border:4px solid rgba(255,255,255,0.1); border-top-color:#00ffcc; border-radius:50%; animation:spin 1s linear infinite; margin-bottom:20px; }
  @keyframes spin { 100% { transform:rotate(360deg); } }
</style>
</head>
<body>

<div id="menu-screen" class="screen active">
  <div class="header"><h1>AI 游戏造梦器</h1><p>选择类型，定制你的专属世界</p></div>
  <div class="category-grid">
    <div class="category-card" onclick="openForm('shooter', '动作射击')"><span class="icon">🚀</span><div class="title">动作射击</div></div>
    <div class="category-card" onclick="openForm('tower', '策略塔防')"><span class="icon">🛡️</span><div class="title">策略塔防</div></div>
  </div>
  <button class="btn-main" onclick="showHistory()" style="background:#333;">📜 查看历史记录</button>
</div>

<div id="form-screen" class="screen">
  <button class="back-btn" onclick="backToMenu()">← 返回大厅</button>
  <h2 id="form-title" class="page-title">定制游戏</h2>
  <div class="form-group"><label>游戏主题 / 风格</label><input type="text" id="form-theme" class="form-control" value="赛博朋克霓虹都市"></div>
  <div class="row-2">
    <div class="form-group"><label>怪物数量</label><input type="number" id="form-enemyCount" class="form-control" value="10"></div>
    <div class="form-group"><label>怪物血量</label><input type="number" id="form-enemyHp" class="form-control" value="30"></div>
  </div>
  <div class="form-group"><label>剧情与玩法描述</label><textarea id="form-story" class="form-control" placeholder="例如：主角需要消灭所有怪物..."></textarea></div>
  <button class="btn-main" onclick="generateGame()">✨ 生成游戏</button>
</div>

<div id="preview-screen" class="screen">
  <h2 class="page-title" style="text-align:center;">🎉 游戏已生成！</h2>
  <div id="preview-thoughts" style="color:#00ffcc; font-size:13px; margin-bottom:20px; padding:10px; background:rgba(0,0,0,0.5); border-radius:8px;"></div>
  <!-- 🌟 这个元素必须有，不然会报 null -->
  <div style="width:100%; height:200px; background:#000; border-radius:12px; border:2px solid #4ea1ff; display:flex; align-items:center; justify-content:center; overflow:hidden; margin-bottom:20px;">
    <img id="preview-img" style="max-width:100%; max-height:100%; object-fit:contain;" src="">
  </div>
  <button class="btn-main" onclick="startPlay()" style="background:#00ffcc; color:#000;">▶ 开始游戏</button>
  <button class="btn-main" onclick="backToMenu()" style="background:#333; margin-top:10px;">返回大厅</button>
</div>

<div id="history-screen" class="screen">
  <button class="back-btn" onclick="backToMenu()">← 返回大厅</button>
  <h2 class="page-title">历史生成记录</h2>
  <div id="history-list"></div>
</div>

<div id="game-bg"></div>
<canvas id="canvas2d"></canvas>
<div id="hud"><div id="hud-title" style="font-weight:700; margin-bottom:4px;">AI造梦器</div><div style="color:#00ffcc;">敌人剩余: 0</div></div>
<button onclick="backToMenu()" style="position:fixed; top:calc(12px + env(safe-area-inset-top)); right:14px; z-index:10; background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.3); color:#fff; padding:6px 12px; border-radius:20px; font-size:12px; display:none;" id="exit-btn">退出</button>

<div id="controls">
  <div class="pad"><div class="btn-ctrl" id="btn-left">←</div><div class="btn-ctrl" id="btn-right">→</div></div>
  <div class="pad"><div class="btn-ctrl" id="btn-shoot">射击</div><div class="btn-ctrl" id="btn-jump">跳跃</div></div>
</div>

<div id="loading-mask"><div class="spinner"></div><div id="loading-text" style="color:#00ffcc; font-weight:bold;">主策推演中...</div></div>

<script type="module" src="app.js"></script>
</body>
</html>
