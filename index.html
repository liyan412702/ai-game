<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AI游戏造梦器</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family: system-ui, sans-serif; user-select:none; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  #canvas3d, #canvas2d { position:absolute; top:0; left:0; width:100%; height:100%; }
  
  #hud { position:fixed; top:calc(12px + env(safe-area-inset-top)); left:14px; color:#fff; font-size:14px; text-shadow:0 1px 3px #000; pointer-events:none; line-height:1.5; z-index:5; }
  #hud .big { font-size:26px; font-weight:800; color:#4ea1ff; }
  #history-btn { position:fixed; top:calc(12px + env(safe-area-inset-top)); right:14px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:#fff; padding:8px 12px; border-radius:8px; font-size:13px; z-index:10; backdrop-filter:blur(4px;); }
  #history-panel { position:fixed; top:0; right:-100%; width:80%; max-width:300px; height:100%; background:rgba(15,15,25,0.95); z-index:20; transition:right 0.3s ease; padding:20px; overflow-y:auto; border-left:1px solid rgba(255,255,255,0.1); }
  #history-panel.show { right:0; }
  .history-item { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); padding:12px; border-radius:10px; margin-bottom:10px; color:#ccc; font-size:14px; }
  .history-item:active { background:rgba(78,161,255,0.2); }

  #controls { position:fixed; left:0; right:0; bottom:calc(10px + env(safe-area-inset-bottom)); display:flex; justify-content:space-between; padding:0 16px; z-index:6; pointer-events:none; }
  .pad { display:flex; gap:12px; pointer-events:auto; }
  .btn-ctrl { width:64px; height:64px; border-radius:50%; border:1.5px solid rgba(255,255,255,.35); background:rgba(255,255,255,.1); color:#fff; font-size:24px; font-weight:700; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(6px); touch-action:none; transition:0.1s; }
  .btn-ctrl:active, .btn-ctrl.on { background:rgba(78,161,255,.6); border-color:#4ea1ff; transform:scale(0.92); box-shadow:0 0 15px #4ea1ff; }
  #jump { width:76px; height:76px; font-size:18px; }
  
  #panel { position:fixed; left:0; right:0; bottom:0; background:rgba(12,12,22,.95); border-top:1px solid rgba(255,255,255,.15); border-radius:18px 18px 0 0; padding:12px 14px calc(14px + env(safe-area-inset-bottom)); z-index:8; transition:transform .3s cubic-bezier(0.4, 0, 0.2, 1); backdrop-filter:blur(12px); }
  #panel.collapsed { transform:translateY(calc(100% - 46px)); }
  #panelToggle { height:34px; display:flex; align-items:center; justify-content:center; color:#889; font-size:13px; cursor:pointer; margin-bottom:8px; }
  #panelToggle::before { content:''; width:44px; height:5px; border-radius:3px; background:rgba(255,255,255,.25); }
  #prompt { width:100%; height:48px; resize:none; border-radius:12px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.05); color:#fff; padding:10px 12px; font-size:15px; outline:none; line-height:1.4; }
  #prompt:focus { border-color:#4ea1ff; box-shadow:0 0 10px rgba(78,161,255,.3); }
  .row { display:flex; gap:8px; margin-top:10px; align-items:center; }
  #gen { flex:1; height:46px; border:none; border-radius:12px; background:linear-gradient(135deg,#4ea1ff,#8b5cf6); color:#fff; font-size:16px; font-weight:700; box-shadow:0 4px 15px rgba(78,161,255,.4); }
  #gen:active { filter:brightness(0.9); transform:translateY(2px); }
  #gen:disabled { opacity:.6; }
  #examples { display:flex; gap:8px; margin-top:10px; overflow-x:auto; padding-bottom:2px; -webkit-overflow-scrolling:touch; }
  .example { flex:0 0 auto; height:34px; padding:0 14px; border-radius:999px; border:1px solid rgba(255,255,255,.25); background:transparent; color:#cfd8ff; font-size:13px; white-space:nowrap; }
  .example:active { background:rgba(255,255,255,.1); }
  
  #overlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.7); z-index:20; padding:20px; backdrop-filter:blur(4px); }
  #overlay.show { display:flex; }
  #overlay .card { background:rgba(20,20,35,.95); border:1px solid rgba(78,161,255,.3); border-radius:18px; padding:26px 24px; text-align:center; color:#fff; width:100%; max-width:340px; }
  #overlay h2 { font-size:24px; margin-bottom:10px; }
  #overlay p { color:#aab; margin-bottom:20px; font-size:14px; }
  #overlay button { width:100%; height:46px; border:none; border-radius:12px; background:linear-gradient(135deg,#4ea1ff,#8b5cf6); color:#fff; font-size:16px; font-weight:700; }
</style>
</head>
<body>
<canvas id="canvas3d"></canvas>
<canvas id="canvas2d" style="display:none;"></canvas>

<div id="hud">
  <div id="hud-title" style="font-size:16px; margin-bottom:4px; font-weight:700;">AI造梦器</div>
  <div id="hud-main" style="margin-top:4px;">得分 <span class="big" id="score">0</span> / <span id="target">200</span></div>
  <div id="status" style="margin-top:2px; color:#aab;">生成后开始</div>
</div>

<button id="history-btn">📜 历史记录</button>
<div id="history-panel">
  <h3 style="color:#fff; margin-bottom:15px; font-size:16px;">历史生成记录</h3>
  <div id="history-list"></div>
  <button id="close-history" style="width:100%; padding:10px; margin-top:20px; background:rgba(255,255,255,0.1); border:none; color:#fff; border-radius:8px;">关闭</button>
</div>

<div id="controls">
  <div class="pad" id="parkour-controls">
    <div class="btn-ctrl" id="left">←</div>
    <div class="btn-ctrl" id="right">→</div>
  </div>
  <div class="pad" id="parkour-jump">
    <div class="btn-ctrl" id="jump">跳</div>
  </div>
</div>

<div id="panel">
  <div id="panelToggle"></div>
  <textarea id="prompt" placeholder="描述你想玩的游戏（如：赛博朋克跑酷 / 2D塔防 / 二次元换装）"></textarea>
  <div class="row"><button id="gen">✨ 生成游戏</button></div>
  <div id="examples">
    <button class="example" data-p="赛博朋克城市，速度快，障碍密集">赛博朋克·跑酷</button>
    <button class="example" data-p="做一个2D塔防游戏，怪物很多">2D·塔防</button>
    <button class="example" data-p="做一个二次元换装游戏，霓虹色彩">二次元·换装</button>
  </div>
</div>

<div id="overlay">
  <div class="card">
    <h2 id="ovTitle">游戏结束</h2>
    <p id="ovDesc"></p>
    <button id="ovBtn">再来一次</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const THEMES = {
  default: { bg:0x050508, ground:0x1b1b2a, player:0x4ea1ff, obstacle:0xff5c8a, light:0xffffff, ambient:0.4 },
  cyber:   { bg:0x050510, ground:0x111128, player:0x00ffff, obstacle:0xff0066, light:0x8888ff, ambient:0.3 },
  forest:  { bg:0x0a1510, ground:0x1f3b25, player:0x9be15d, obstacle:0x40c057, light:0xc8ffb0, ambient:0.6 }
};
let config = { 
    gameType:'parkour', theme:'default', title:'默认游戏', 
    speed:14, jumpForce:9, gravity:26, density:0.7, targetScore:200, 
    waves:5, enemyHp:100, coins:200,
    hairColor: '#ff0066', clothesColor: '#00ffff', pantsColor: '#ffcc00'
};
let state = 'ready';
const overlay = document.getElementById('overlay'), ovTitle = document.getElementById('ovTitle'), ovDesc = document.getElementById('ovDesc'), ovBtn = document.getElementById('ovBtn');
const statusEl = document.getElementById('status'), hudMain = document.getElementById('hud-main');

function showOverlay(title, desc) { ovTitle.textContent = title; ovDesc.textContent = desc; overlay.classList.add('show'); }
function hideOverlay() { overlay.classList.remove('show'); }
ovBtn.addEventListener('click', () => { hideOverlay(); startGame(); });

// ==========================================
// 引擎一：3D 跑酷 (Three.js)
// ==========================================
const canvas3d = document.getElementById('canvas3d');
const renderer = new THREE.WebGLRenderer({ canvas: canvas3d, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 400);
camera.position.set(0, 6, 11); camera.lookAt(0, 1.5, -12);
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
bloomPass.threshold = 0.2; bloomPass.strength = 1.2; bloomPass.radius = 0.5;
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera)); composer.addPass(bloomPass);

let ground, player3d, ambientLight, dirLight, gridHelper;
const obstacles = [];
let p3dDist = 0, p3dScore = 0, p3dX = 0, p3dY = 1, p3dVY = 0, p3dGround = true, p3dTimer = 0;

function build3DScene() {
  for (const o of obstacles) scene.remove(o);
  obstacles.length = 0;
  if (ground) { scene.remove(ground); ground.geometry.dispose(); ground.material.dispose(); }
  if (gridHelper) scene.remove(gridHelper);
  if (player3d) { scene.remove(player3d); player3d.geometry.dispose(); player3d.material.dispose(); }
  if (ambientLight) scene.remove(ambientLight); if (dirLight) scene.remove(dirLight);

  const t = THEMES[config.theme] || THEMES.default;
  scene.background = new THREE.Color(t.bg); scene.fog = new THREE.Fog(t.bg, 40, 150);
  ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 300), new THREE.MeshStandardMaterial({ color:t.ground, roughness:0.8 }));
  ground.rotation.x = -Math.PI / 2; ground.position.z = -140; scene.add(ground);
  gridHelper = new THREE.GridHelper(300, 150, t.player, t.ground); gridHelper.position.z = -140; gridHelper.position.y = 0.01; scene.add(gridHelper);
  player3d = new THREE.Mesh(new THREE.BoxGeometry(1, 1.6, 1), new THREE.MeshStandardMaterial({ color: t.player, emissive: t.player, emissiveIntensity: 1.5 }));
  player3d.position.set(0, 1, 0); scene.add(player3d);
  ambientLight = new THREE.AmbientLight(0xffffff, t.ambient); scene.add(ambientLight);
  dirLight = new THREE.DirectionalLight(t.light, 1.5); dirLight.position.set(5, 15, 5); scene.add(dirLight);
}

function update3D(dt, time) {
  if (state !== 'playing') return;
  const speed = config.speed || 14;
  if (keys.left) p3dX -= 10 * dt; if (keys.right) p3dX += 10 * dt;
  p3dX = Math.max(-5, Math.min(5, p3dX));
  if (!p3dGround) { p3dVY -= (config.gravity||26) * dt; p3dY += p3dVY * dt; if (p3dY <= 1) { p3dY = 1; p3dVY = 0; p3dGround = true; } }
  player3d.position.set(p3dX, p3dY, 0); player3d.rotation.y += dt * 2;
  
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i]; o.position.z += speed * dt; o.rotation.x += dt; o.rotation.y += dt;
    if (o.position.z > 8) { scene.remove(o); o.geometry.dispose(); o.material.dispose(); obstacles.splice(i, 1); }
  }
  p3dTimer -= dt; if (p3dTimer <= 0) { spawnObstacle3D(); p3dTimer = 0.9 / Math.max(0.2, (config.density||0.7)); }
  
  for (const o of obstacles) {
    if (Math.abs(o.position.x - player3d.position.x) < o.userData.hw + 0.4 && Math.abs(o.position.y - player3d.position.y) < o.userData.hh + 0.8 && Math.abs(o.position.z - player3d.position.z) < 1.0) {
      state = 'over'; showOverlay('💥 撞到了！', `得分 ${p3dScore}`); return;
    }
  }
  p3dDist += speed * dt; p3dScore = Math.floor(p3dDist / 2); updateHUD3D();
  if (p3dScore >= (config.targetScore||200)) { state = 'win'; showOverlay('🎉 通关！', `你完成了《${config.title}》`); }
}
function spawnObstacle3D() {
  const t = THEMES[config.theme] || THEMES.default, size = 1 + Math.random() * 1.2;
  const mesh = new THREE.Mesh(new THREE.OctahedronGeometry(size), new THREE.MeshStandardMaterial({ color: t.obstacle, emissive: t.obstacle, emissiveIntensity: 1.2, wireframe: Math.random() > 0.5 }));
  mesh.position.set((Math.random() - 0.5) * 8, size, -100);
  mesh.userData = { hw: size, hh: size }; scene.add(mesh); obstacles.push(mesh);
}
function updateHUD3D() { if (hudMain) hudMain.innerHTML = `得分 <span class="big">${p3dScore}</span> / <span>${config.targetScore||200}</span>`; }


// ==========================================
// 引擎二：2D 塔防 (Canvas 2D)
// ==========================================
const canvas2d = document.getElementById('canvas2d');
const ctx = canvas2d.getContext('2d');
let enemies2d = [], towers2d = [], bullets2d = [];
let game2dRunning = false, coins2d = 0, baseHp2d = 100, wave2d = 1, spawnTimer2d = 0, spawnedCount2d = 0;

function resize2D() { canvas2d.width = window.innerWidth; canvas2d.height = window.innerHeight; }

function build2DScene() {
  resize2D();
  coins2d = config.coins || 200;
  baseHp2d = 100; wave2d = 1;
  enemies2d = []; towers2d = []; bullets2d = [];
  game2dRunning = true;
  spawnTimer2d = 0;
  spawnedCount2d = 0;
}

function update2D(dt) {
  if (state !== 'playing' || !game2dRunning) return;
  ctx.clearRect(0, 0, canvas2d.width, canvas2d.height);
  
  ctx.strokeStyle = '#333'; ctx.lineWidth = 40; ctx.beginPath();
  ctx.moveTo(canvas2d.width, canvas2d.height / 2);
  ctx.lineTo(0, canvas2d.height / 2); ctx.stroke();

  spawnTimer2d -= dt;
  const maxWaves = config.waves || 5;
  const totalEnemies = maxWaves * 5;
  
  if (spawnTimer2d <= 0 && spawnedCount2d < totalEnemies) {
    spawnedCount2d++;
    enemies2d.push({ 
        x: canvas2d.width + 20, y: canvas2d.height / 2, 
        hp: config.enemyHp || 100, maxHp: config.enemyHp || 100, speed: 30 + wave2d * 10 
    });
    spawnTimer2d = 1.0;
    if (spawnedCount2d % 5 === 0) wave2d++;
  }

  for (let i = enemies2d.length - 1; i >= 0; i--) {
    const en = enemies2d[i]; en.x -= en.speed * dt;
    ctx.fillStyle = '#ff0066'; ctx.fillRect(en.x - 15, en.y - 15, 30, 30);
    ctx.fillStyle = '#fff'; ctx.fillRect(en.x - 15, en.y - 20, 30 * (en.hp / en.maxHp), 4);
    if (en.x < 0) { baseHp2d -= 10; enemies2d.splice(i, 1); }
    if (baseHp2d <= 0) { state = 'over'; game2dRunning = false; showOverlay('💀 基地被摧毁！', `坚持到了第 ${wave2d} 波`); return; }
  }

  towers2d.forEach(t => {
    t.cooldown -= dt;
    if (t.cooldown <= 0) {
      const target = enemies2d.find(e => Math.hypot(e.x - t.x, e.y - t.y) < t.range);
      if (target) { bullets2d.push({ x: t.x, y: t.y, target, speed: 400, dmg: 50 }); t.cooldown = 0.5; }
    }
    ctx.fillStyle = '#00ffff'; ctx.beginPath(); ctx.arc(t.x, t.y, 15, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,255,255,0.2)'; ctx.beginPath(); ctx.arc(t.x, t.y, t.range, 0, Math.PI * 2); ctx.stroke();
  });

  for (let i = bullets2d.length - 1; i >= 0; i--) {
    const b = bullets2d[i];
    if (!b.target || b.target.hp <= 0) { bullets2d.splice(i, 1); continue; }
    const dx = b.target.x - b.x, dy = b.target.y - b.y, dist = Math.hypot(dx, dy);
    if (dist < 20) { b.target.hp -= b.dmg; bullets2d.splice(i, 1); }
    else { b.x += (dx / dist) * b.speed * dt; b.y += (dy / dist) * b.speed * dt; }
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill();
  }

  enemies2d = enemies2d.filter(e => e.hp > 0);
  
  if (spawnedCount2d >= totalEnemies && enemies2d.length === 0 && state === 'playing') {
      state = 'win'; game2dRunning = false; showOverlay('🎉 防守成功！', `你抵挡住了所有怪物！`); return;
  }

  if (hudMain) hudMain.innerHTML = `<span style="font-size:26px; font-weight:800; color:#4ea1ff;">${baseHp2d} HP</span> | 金币 ${coins2d}`;
  if (statusEl) statusEl.textContent = `波次: ${wave2d}/${maxWaves} | 点击屏幕建塔(50金币)`;
}


// ==========================================
// 引擎三：换装 (Canvas 2D)
// ==========================================
let dressupColors = [];
let dressupParts = { hair: 0, clothes: 0, pants: 0 };

function buildDressupScene() {
  resize2D();
  dressupColors = [config.hairColor || '#ff0066', config.clothesColor || '#00ffff', config.pantsColor || '#ffcc00', '#ffffff', '#ffaa00'];
  dressupParts = { hair: 0, clothes: 1, pants: 2 }; // 默认索引
  if (hudMain) hudMain.innerHTML = `点击人物换色`;
  if (statusEl) statusEl.textContent = `点击头部/身体/腿部 切换颜色`;
}

function updateDressup() {
  if (state !== 'playing') return;
  ctx.clearRect(0, 0, canvas2d.width, canvas2d.height);
  
  const cx = canvas2d.width / 2;
  const cy = canvas2d.height / 2 - 50;
  
  // 画腿
  ctx.fillStyle = dressupColors[dressupParts.pants];
  ctx.fillRect(cx - 30, cy + 60, 25, 80); // 左腿
  ctx.fillRect(cx + 5, cy + 60, 25, 80);  // 右腿
  
  // 画身体
  ctx.fillStyle = dressupColors[dressupParts.clothes];
  ctx.fillRect(cx - 40, cy - 20, 80, 80); 
  
  // 画头
  ctx.fillStyle = dressupColors[dressupParts.hair];
  ctx.beginPath(); ctx.arc(cx, cy - 50, 40, 0, Math.PI * 2); ctx.fill();
  
  // 画眼睛
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(cx - 15, cy - 50, 6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 15, cy - 50, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(cx - 15, cy - 50, 3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 15, cy - 50, 3, 0, Math.PI * 2); ctx.fill();

  // 画点击提示框
  ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
  ctx.strokeRect(cx - 45, cy - 95, 90, 90); // 头部
  ctx.strokeRect(cx - 45, cy - 25, 90, 90); // 身体
  ctx.strokeRect(cx - 35, cy + 55, 70, 90); // 腿部
  ctx.setLineDash([]);
}

// 换装点击事件
canvas2d.addEventListener('pointerdown', (e) => {
  if (state !== 'playing' || config.gameType !== 'dressup') return;
  const cx = canvas2d.width / 2;
  const cy = canvas2d.height / 2 - 50;
  const x = e.clientX, y = e.clientY;
  
  // 判断点击区域
  if (y > cy - 95 && y < cy - 5) { // 头
    dressupParts.hair = (dressupParts.hair + 1) % dressupColors.length;
  } else if (y >= cy - 5 && y < cy + 65) { // 身体
    dressupParts.clothes = (dressupParts.clothes + 1) % dressupColors.length;
  } else if (y >= cy + 65 && y < cy + 145) { // 腿
    dressupParts.pants = (dressupParts.pants + 1) % dressupColors.length;
  }
});


// ==========================================
// 主循环与场景切换
// ==========================================
let lastTime = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastTime) / 1000, 0.05); lastTime = now;
  
  try {
      if (config.gameType === 'tower') {
        update2D(dt);
      } else if (config.gameType === 'dressup') {
        updateDressup();
      } else {
        update3D(dt, now); composer.render();
      }
  } catch(e) { console.error(e); }
}

function startGame() {
  hideOverlay(); document.getElementById('panel').classList.add('collapsed');
  state = 'playing';
  if (statusEl) statusEl.textContent = '进行中 · ' + config.title;
  document.getElementById('hud-title').textContent = config.title;

  if (config.gameType !== 'parkour') {
    canvas3d.style.display = 'none'; canvas2d.style.display = 'block';
    document.getElementById('parkour-controls').style.display = 'none';
    document.getElementById('parkour-jump').style.display = 'none';
    
    if (config.gameType === 'tower') build2DScene();
    if (config.gameType === 'dressup') buildDressupScene();
  } else {
    canvas3d.style.display = 'block'; canvas2d.style.display = 'none';
    document.getElementById('parkour-controls').style.display = 'flex';
    document.getElementById('parkour-jump').style.display = 'flex';
    build3DScene();
    p3dDist = 0; p3dScore = 0; p3dX = 0; p3dY = 1; p3dVY = 0; p3dGround = true; p3dTimer = 0;
    updateHUD3D();
  }
}

// 键鼠事件
const keys = { left:false, right:false };
document.getElementById('left').addEventListener('touchstart', () => keys.left=true);
document.getElementById('left').addEventListener('touchend', () => keys.left=false);
document.getElementById('right').addEventListener('touchstart', () => keys.right=true);
document.getElementById('right').addEventListener('touchend', () => keys.right=false);
document.getElementById('jump').addEventListener('touchstart', () => { if(state==='playing' && config.gameType==='parkour' && p3dGround) { p3dVY = config.jumpForce||9; p3dGround = false; } });
document.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true; if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true; if (e.code === 'Space' && state === 'playing' && config.gameType === 'parkour' && p3dGround) { e.preventDefault(); p3dVY = config.jumpForce||9; p3dGround = false; } });
document.addEventListener('keyup', (e) => { if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false; if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false; });
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); composer.setSize(window.innerWidth, window.innerHeight); resize2D();
});


// ==========================================
// 历史记录与 AI 生成
// ==========================================
const promptEl = document.getElementById('prompt'), genBtn = document.getElementById('gen'), panel = document.getElementById('panel');
document.getElementById('panelToggle').addEventListener('click', () => panel.classList.toggle('collapsed'));
const historyBtn = document.getElementById('history-btn'), historyPanel = document.getElementById('history-panel'), historyList = document.getElementById('history-list');
historyBtn.addEventListener('click', () => { renderHistory(); historyPanel.classList.add('show'); });
document.getElementById('close-history').addEventListener('click', () => historyPanel.classList.remove('show'));

function saveHistory(promptText, configObj) {
  let hist = JSON.parse(localStorage.getItem('ai_game_history') || '[]');
  hist = hist.filter(item => item.prompt !== promptText);
  hist.unshift({ prompt: promptText, config: configObj, time: Date.now() });
  if (hist.length > 20) hist.pop();
  localStorage.setItem('ai_game_history', JSON.stringify(hist));
}
function renderHistory() {
  let hist = JSON.parse(localStorage.getItem('ai_game_history') || '[]');
  if (hist.length === 0) { historyList.innerHTML = '<p style="color:#666; text-align:center;">暂无</p>'; return; }
  historyList.innerHTML = hist.map((item, index) => `
    <div class="history-item" data-index="${index}">
      <div style="color:#fff; margin-bottom:4px;">${item.config.title}</div>
      <div style="font-size:12px; color:#889; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${item.prompt}</div>
    </div>`).join('');
  document.querySelectorAll('.history-item').forEach(el => {
    el.addEventListener('click', () => { config = hist[parseInt(el.dataset.index)].config; promptEl.value = hist[parseInt(el.dataset.index)].prompt; startGame(); historyPanel.classList.remove('show'); });
  });
}

async function generate() {
  const text = promptEl.value.trim() || '做一个默认的3D跑酷游戏';
  genBtn.disabled = true; genBtn.textContent = 'AI构思中…';
  try {
    const res = await fetch('/api/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt: text }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '生成失败');
    
    config = data; 
    
    // 🚨 绝对防御：关键词拦截
    if (text.includes('塔防') || text.includes('防御')) {
        config.gameType = 'tower';
        config.waves = config.waves || 5;
        config.enemyHp = config.enemyHp || 100;
        config.coins = config.coins || 200;
    } else if (text.includes('换装') || text.includes('穿衣') || text.includes('衣服') || text.includes('打扮')) {
        config.gameType = 'dressup';
        config.hairColor = config.hairColor || '#ff0066';
        config.clothesColor = config.clothesColor || '#00ffff';
        config.pantsColor = config.pantsColor || '#ffcc00';
    } else {
        config.gameType = 'parkour';
        config.speed = config.speed || 14;
        config.targetScore = config.targetScore || 200;
    }
    if(!config.title) config.title = '自定义游戏';

    saveHistory(text, config);
  } catch (err) {
    alert('AI生成失败：' + err.message); genBtn.disabled = false; genBtn.textContent = '✨ 生成游戏'; return;
  }
  startGame(); genBtn.disabled = false; genBtn.textContent = '✨ 生成游戏';
}
genBtn.addEventListener('click', generate);
document.querySelectorAll('.example').forEach(btn => {
  btn.addEventListener('click', () => { promptEl.value = btn.dataset.p; generate(); });
});

// 初始化
resize2D(); requestAnimationFrame(animate);
</script>
